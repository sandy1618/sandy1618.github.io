<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Prefill: llama.cpp about 570 tokens per second, BaseRT 300, colibri 4.5. Decode: llama.cpp 56, BaseRT 66, colibri about 5"><style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size:17px; font-weight:600; fill:var(--ink); }
  .sub { font-size:13px; fill:var(--ink2); }
  .label { font-size:13px; fill:var(--ink); }
  .label2 { font-size:12px; fill:var(--ink2); }
  .value { font-size:13px; font-weight:600; fill:var(--ink); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .note { font-size:11px; fill:var(--muted); }
  .grid { stroke:var(--grid); stroke-width:1; }
  .base { stroke:var(--axis); stroke-width:1; }
</style><rect width="760" height="280" rx="8" fill="var(--surface)"/><text class="title" x="24" y="34">Reading the prompt vs writing the answer (tokens per second)</text><text class="sub" x="24" y="56">One request at a time, Qwen 3.6 35B-A3B (4-bit), M1 Max · from each engine's own logs</text><rect x="24" y="73" width="10" height="10" rx="2" fill="var(--s1)"/><text class="label2" x="39" y="82">llama.cpp</text><rect x="133" y="73" width="10" height="10" rx="2" fill="var(--s2)"/><text class="label2" x="148" y="82">BaseRT</text><rect x="218" y="73" width="10" height="10" rx="2" fill="var(--s3)"/><text class="label2" x="233" y="82">colibri</text><text class="label" x="24" y="110" font-weight="600">Prompt processing (prefill)</text><text class="label" x="396" y="110" font-weight="600">Answer generation (decode)</text><line class="grid" x1="104.0" y1="120" x2="104.0" y2="222"/><text class="tick" x="104.0" y="238" text-anchor="middle">0</text><line class="grid" x1="160.7" y1="120" x2="160.7" y2="222"/><text class="tick" x="160.7" y="238" text-anchor="middle">200</text><line class="grid" x1="217.3" y1="120" x2="217.3" y2="222"/><text class="tick" x="217.3" y="238" text-anchor="middle">400</text><line class="grid" x1="274.0" y1="120" x2="274.0" y2="222"/><text class="tick" x="274.0" y="238" text-anchor="middle">600</text><text class="label" x="24" y="142.0">llama.cpp</text><path d="M104,127.0 H261.5 Q265.5,127.0 265.5,131.0 V143.0 Q265.5,147.0 261.5,147.0 H104 Z" fill="var(--s1)"/><text class="value" x="273.5" y="142.0">~570</text><text class="label" x="24" y="176.0">BaseRT</text><path d="M104,161.0 H185.0 Q189.0,161.0 189.0,165.0 V177.0 Q189.0,181.0 185.0,181.0 H104 Z" fill="var(--s2)"/><text class="value" x="197.0" y="176.0">~300</text><text class="label" x="24" y="210.0">colibri</text><path d="M104,195.0 H105.5 Q107,195.0 107,196.5 V213.5 Q107,215.0 105.5,215.0 H104 Z" fill="var(--s3)"/><text class="value" x="113.3" y="210.0">~4.5</text><line class="base" x1="104" y1="120" x2="104" y2="222"/><line class="grid" x1="476.0" y1="120" x2="476.0" y2="222"/><text class="tick" x="476.0" y="238" text-anchor="middle">0</text><line class="grid" x1="518.5" y1="120" x2="518.5" y2="222"/><text class="tick" x="518.5" y="238" text-anchor="middle">20</text><line class="grid" x1="561.0" y1="120" x2="561.0" y2="222"/><text class="tick" x="561.0" y="238" text-anchor="middle">40</text><line class="grid" x1="603.5" y1="120" x2="603.5" y2="222"/><text class="tick" x="603.5" y="238" text-anchor="middle">60</text><line class="grid" x1="646.0" y1="120" x2="646.0" y2="222"/><text class="tick" x="646.0" y="238" text-anchor="middle">80</text><text class="label" x="396" y="142.0">llama.cpp</text><path d="M476,127.0 H591.0 Q595.0,127.0 595.0,131.0 V143.0 Q595.0,147.0 591.0,147.0 H476 Z" fill="var(--s1)"/><text class="value" x="603.0" y="142.0">56</text><text class="label" x="396" y="176.0">BaseRT</text><path d="M476,161.0 H612.25 Q616.25,161.0 616.25,165.0 V177.0 Q616.25,181.0 612.25,181.0 H476 Z" fill="var(--s2)"/><text class="value" x="624.2" y="176.0">66</text><text class="label" x="396" y="210.0">colibri</text><path d="M476,195.0 H482.625 Q486.625,195.0 486.625,199.0 V211.0 Q486.625,215.0 482.625,215.0 H476 Z" fill="var(--s3)"/><text class="value" x="494.6" y="210.0">~5 (estimated)</text><line class="base" x1="476" y1="120" x2="476" y2="222"/><text class="note" x="24" y="266">My prompts are long (~4,500 tokens), so prefill decides as much as decode: BaseRT writes faster but reads at half llama.cpp's speed.</text></svg>
