title: Sandeep Nayak
description: Notes from building data pipelines and running LLMs on my own hardware, with the numbers I measured.
author: Sandeep Nayak
github_username: sandy1618
timezone: Asia/Tokyo
lang: en

permalink: /:year/:month/:day/:title.html

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-github-metadata

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

highlighter: rouge
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
